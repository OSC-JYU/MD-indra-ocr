name: md-indra-ocr

services:

  md-indra-ocr:
    image: localhost/messydesk/md-indra-ocr:local
    build: .
    restart: unless-stopped
    environment:
      SERVICE_LOCAL_URL: http://md-indra-ocr:9013
      INDRA_THREADS: ${INDRA_THREADS:-4}
    volumes:
      - indra-models:/models:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9013/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
        aliases: [md-indra-ocr]

  consumer-indra-ocr:
    image: localhost/messydesk/md-consumer:local
    build: ${MD_CONSUMERS_DIR:-../MD-consumers}
    restart: unless-stopped
    depends_on:
      md-indra-ocr:
        condition: service_healthy
    volumes:
      - md-data:/md/data:z
    # Same SELinux level as every container on md-data (see MessyDesk/local/compose.yaml).
    security_opt:
      - label=level:s0:c100,c200
    tmpfs:
      - /src/data:mode=1777
    environment:
      MD_URL: ${MD_URL:-http://backend:8200}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-too}
      MD_PATH: /md
      TOPIC: md-indra-ocr
      DEV_URL: http://md-indra-ocr:9013

networks:
  default:
    name: ${MESSYDESK_NETWORK:-messydesk_default}
    external: true

volumes:
  md-data:
    name: ${MESSYDESK_DATA_VOLUME:-messydesk_md-data}
    external: true
  indra-models:
